<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
    <link rel="stylesheet"
          href="https://www.w3schools.com/lib/w3-theme-blue.css">
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/5/w3.css">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="css/style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BAN Project - Dashboard</title>


    <script>
        window.App = window.App || {};
        App.Errors = App.Errors || {};

        App.init = function () {

            $.ajaxSetup({cache: false});
            // Load initial content
            $('#navigation').load("Menu.jsp");
            $('#content').load("Stations.jsp");
            $('#rcolumn').load('NewClient.jsp');

            // Attach global events
            App.bindEvents();

        };

        App.loadPage = function (page) {
            $('#content').load(page + ".jsp");
        };

        App.loadClients = function () {
            $('#content').load('Clients.jsp');

        };

        App.bindEvents = function () {

        };

        App.stack = function () {
            $("#stack").toggleClass("w3-show");
        };

        // Ensure `App.init` runs correctly
        $(document).ready(function () {
            App.init();
        });
    </script>

</head>
<body>

<!-- Begin Navigation -->
<div class="w3-theme w3-top" id="navigation"></div>
<!-- End Navigation -->

<!-- Begin Content -->
<div class="w3-row-padding" style="margin-top: 65px">

    <script src="js/stations.js"></script>

    <!-- Left Column -->
    <div class="w3-container w3-col m3 w3-hide-small">
        <div id="lcolumn">
            <p> </p>
        </div>
    </div>
    <!-- Middle Column -->
    <div class="w3-container w3-col m6">
        <div id="content"></div>
    </div>
    <!-- Right Column -->
    <div class="w3-container w3-col m3 w3-hide-small">
        <div id="rcolumn"></div>
    </div>

</div>
<!-- End Content -->

<script src="js/stations.js"></script>
<script src="js/clients.js"></script>
</body>
</html>
